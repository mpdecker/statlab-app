name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-build:
    name: test & build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

# Production deploys are handled by Cloudflare's native GitHub App
# integration (Workers & Pages), connected directly to this repo and
# triggered independently of this workflow — see the "Cloudflare Pages"
# check on any commit/PR. A second, explicit `deploy` job here using
# `wrangler pages deploy` + a CLOUDFLARE_API_TOKEN secret was redundant
# with that and had been failing on every push to main since at least
# 2026-09-10 (Authentication error [code: 10000] against the Pages API),
# silently, since the native integration deployed successfully regardless.
# Removed rather than fixed: there is nothing for it to do that the
# native integration doesn't already do.
